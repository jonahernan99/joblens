[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joblens"
version = "0.4.0"
description = "Explainable resume-to-job matching with NLP skill extraction and gap analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jonathan Yesid Hernandez Bautista" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["nlp", "resume", "job-matching", "skill-extraction", "ats", "career"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pypdf>=4.0"]

[project.scripts]
joblens = "joblens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joblens = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the embeddings extra and downloads a real model"]
